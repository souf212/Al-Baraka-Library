debug: false
server:
  address: ${BARAKA_BIND:127.0.0.1}
  port: ${BARAKA_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${BARAKA_HTTPS:false}
spring:
  datasource:
    url: jdbc:sqlite:${BARAKA_DB:data/baraka-library.db}?foreign_keys=on&busy_timeout=10000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  sql:
    init:
      mode: never
server.error.include-message: never
baraka:
  zone: Africa/Casablanca
  backup-directory: ${BARAKA_BACKUPS:backups}
logging.level.org.hibernate.orm.deprecation: ERROR
