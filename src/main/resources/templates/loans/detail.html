<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('تفاصيل الإعارة')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>تفاصيل الإعارة</h1><p>سجل واضح لكل كتاب، من الإعارة إلى الإرجاع.</p></div></div><section class="panel"><h2 th:text="${loan.book.title}"></h2><p><a th:href="@{/borrowers/{id}(id=${loan.borrower.id})}" th:text="${loan.borrower.fullName}"></a></p><dl class="detail-grid"><dt>تاريخ الإعارة</dt><dd th:text="${loan.loanDate}"></dd><dt>موعد الإرجاع</dt><dd th:text="${loan.dueDate}"></dd><dt>الحالة</dt><dd th:text="${loan.status == 'RETURNED' ? 'مُرجع' : (loan.dueDate.isBefore(today) ? 'متأخرة' : 'نشطة')}"></dd><dt>عدد التجديدات</dt><dd th:text="${loan.renewalCount}"></dd><dt>الإرجاع الفعلي</dt><dd th:text="${loan.returnedAt}"></dd><dt>ملاحظات</dt><dd th:text="${loan.notes}"></dd></dl><div class="loan-actions" th:if="${loan.status == 'ACTIVE'}"><form method="post" th:action="@{/loans/{id}/return(id=${loan.id})}" data-confirm="هل استلمت الكتاب وتريد تسجيل إرجاعه؟"><button class="btn btn-primary">✓ تأكيد استلام الكتاب</button></form><form method="post" th:action="@{/loans/{id}/renew(id=${loan.id})}" class="inline-form"><label for="newDue">موعد جديد</label><input class="form-control" id="newDue" type="date" name="dueDate" th:value="${suggestedDue}" required><button class="btn btn-light">تجديد الإعارة</button></form></div></section><section class="panel"><h2>سجل التجديدات</h2><div class="table-responsive"><table class="table"><thead><tr><th>الموعد السابق</th><th>الموعد الجديد</th><th>تاريخ التجديد</th></tr></thead><tbody><tr th:each="r : ${renewals}"><td th:text="${r.oldDueDate}"></td><td th:text="${r.newDueDate}"></td><td th:text="${r.renewedAt}"></td></tr><tr th:if="${#lists.isEmpty(renewals)}"><td class="empty" colspan="3">لم يتم تجديد هذه الإعارة</td></tr></tbody></table></div></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
