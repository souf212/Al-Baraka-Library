<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('إعارة جديدة')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>كتاب إلى قارئ جديد</h1><p>اختر المستعير والكتاب، وحدّد موعد اللقاء القادم.</p></div></div><form class="panel editor" method="post" th:action="@{/loans/new}" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><div class="form-grid"><div class="field"><label for="borrowerId">المستعير</label><input class="form-control choice-search" data-select="borrowerId" placeholder="تصفية المستعيرين بالاسم" aria-label="تصفية المستعيرين"><select class="form-select" th:field="*{borrowerId}" required><option value="">اختر المستعير</option><option th:each="b : ${borrowers}" th:value="${b.id}" th:text="${b.fullName}"></option></select></div><div class="field"><label for="bookId">الكتاب المتاح</label><input class="form-control choice-search" data-select="bookId" placeholder="تصفية الكتب بالعنوان" aria-label="تصفية الكتب"><select class="form-select" th:field="*{bookId}" required><option value="">اختر الكتاب</option><option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title} + ' — ' + ${b.author}"></option></select></div><div class="field"><label for="loanDate">تاريخ الإعارة</label><input class="form-control" id="loanDate" type="date" th:field="*{loanDate}" required></div><div class="field"><label for="dueDate">موعد الإرجاع</label><input class="form-control" id="dueDate" type="date" th:field="*{dueDate}" required></div><div class="field wide"><label for="notes">ملاحظات</label><textarea class="form-control" id="notes" th:field="*{notes}" rows="4"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">حفظ البيانات</button><button type="button" class="btn btn-light" data-back>رجوع</button></div></form></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
