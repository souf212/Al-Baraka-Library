<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('الإعارات')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>رحلة الكتب</h1><p>تابع الإعارات، وسجّل الإرجاع أو امنح القارئ وقتًا إضافيًا.</p></div><a class="btn btn-primary" th:href="@{/loans/new}">＋ إعارة جديدة</a></div><section class="panel"><form class="filters" th:action="@{/loans}"><select class="form-select" name="status" aria-label="حالة الإعارة"><option value="">كل الإعارات</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">نشطة</option><option value="RETURNED" th:selected="${status == 'RETURNED'}">مُرجعة</option></select><label class="check"><input type="checkbox" name="overdue" value="true" th:checked="${overdue}"> المتأخرة فقط</label><button class="btn btn-primary">تطبيق</button></form><th:block th:with="rows=${rows.content}"><div th:replace="~{fragments/layout :: loanTable}"></div></th:block><div class="pagination-bar"><a th:if="${rows.hasPrevious()}" th:href="@{/loans(status=${status},overdue=${overdue},page=${rows.number-1})}">السابق</a><span th:text="'صفحة ' + ${rows.number+1}"></span><a th:if="${rows.hasNext()}" th:href="@{/loans(status=${status},overdue=${overdue},page=${rows.number+1})}">التالي</a></div></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
