<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('مراجعة التذكير')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>كلمات تذكّر بالخير</h1><p>راجع الرسالة قبل فتح واتساب وإرسالها يدويًا.</p></div></div><section class="panel message-panel"><span class="eyebrow">نص الرسالة</span><pre id="message-text" th:text="${reminder.message}"></pre><div class="form-actions"><form method="post" th:action="@{/reminders/{id}/open(id=${reminder.id})}" target="_blank"><button class="btn btn-primary">إرسال عبر واتساب ↗</button></form><button type="button" class="btn btn-light" id="copy-message">نسخ النص</button></div><p id="copy-status" role="status"></p><hr><p>هذا سجل إجراء يدوي، وليس تأكيدًا لوصول الرسالة.</p><dl class="detail-grid"><dt>تاريخ التحضير</dt><dd th:text="${reminder.preparedAt}"></dd><dt>فتح واتساب</dt><dd th:text="${reminder.whatsappOpenedAt != null ? reminder.whatsappOpenedAt : 'لم يُفتح'}"></dd><dt>تأكيد الإرسال اليدوي</dt><dd th:text="${reminder.manuallyConfirmedSentAt != null ? reminder.manuallyConfirmedSentAt : 'غير مؤكد'}"></dd></dl><form method="post" th:action="@{/reminders/{id}/confirm(id=${reminder.id})}" data-confirm="هل أرسلت الرسالة بنفسك في واتساب؟"><button class="btn btn-outline-success" th:disabled="${reminder.manuallyConfirmedSentAt != null}">أؤكد أنني أرسلت الرسالة يدويًا</button></form><p class="muted mt-3">بعد فتح واتساب، حدّث هذه الصفحة لإظهار وقت الفتح قبل تسجيل التأكيد.</p></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
