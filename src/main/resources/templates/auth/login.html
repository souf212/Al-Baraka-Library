<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('تسجيل الدخول')}"></head><body class="auth-page"><main class="auth-main"><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="auth-brand">▤</div><h1 th:text="${library.libraryName}"></h1><p class="muted">أهلًا بك، سجّل الدخول لإدارة مكتبتك</p><form class="panel" th:action="@{/login}" method="post"><h2>تسجيل الدخول</h2><div class="alert alert-danger" th:if="${param.error}">اسم المستخدم أو كلمة المرور غير صحيحة</div><div class="alert alert-success" th:if="${param.created}">تم إنشاء المدير. يمكنك تسجيل الدخول الآن.</div><div class="alert alert-success" th:if="${param.logout}">تم تسجيل الخروج بأمان</div><label for="username">اسم المستخدم</label><input class="form-control" id="username" name="username" autocomplete="username" dir="ltr" required><label for="password">كلمة المرور</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary w-100">دخول إلى المكتبة ←</button></form><p class="auth-note">مساحة صغيرة للكتب، وأثر كبير في المعرفة.</p></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
