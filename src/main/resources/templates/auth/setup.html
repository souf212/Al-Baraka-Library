<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('إعداد المدير')}"></head><body class="auth-page"><main class="auth-main"><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="auth-brand">▤</div><h1>مرحبًا في مكتبة البركة</h1><p class="muted">إعداد آمن للمرة الأولى — أنشئ حساب مدير المكتبة</p><form class="panel editor" method="post" th:action="@{/setup}" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><div class="form-grid"><div class="field"><label for="username">اسم المستخدم</label><input class="form-control" id="username" type="text" th:field="*{username}" required autocomplete="username" dir="ltr"></div><div class="field"><label for="fullName">الاسم الكامل</label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" required></div><div class="field"><label for="password">كلمة المرور (١٢ حرفًا على الأقل)</label><input class="form-control" id="password" type="password" th:field="*{password}" required minlength="12" autocomplete="new-password"></div><div class="field"><label for="setupToken">رمز الإعداد من نافذة تشغيل التطبيق</label><input class="form-control" name="setupToken" id="setupToken" dir="ltr" required autocomplete="off"></div></div><div class="form-actions"><button class="btn btn-primary">حفظ البيانات</button><button type="button" class="btn btn-light" data-back>رجوع</button></div></form></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
