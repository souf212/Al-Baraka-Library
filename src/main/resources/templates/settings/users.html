<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('المستخدمون')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>فريق المكتبة</h1><p>حساب مستقل وصلاحيات واضحة لكل مسؤول.</p></div></div><section class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.fullName}"></td><td th:text="${u.username}"></td><td th:text="${u.role == 'ADMIN' ? 'مدير' : 'أمين مكتبة'}"></td><td th:text="${u.enabled ? 'مفعّل' : 'معطّل'}"></td><td><form class="inline-form" method="post" th:action="@{/users/{id}/edit(id=${u.id})}"><input class="form-control" name="fullName" th:value="${u.fullName}" required maxlength="160" aria-label="الاسم الكامل"><select class="form-select" name="role" aria-label="الدور"><option value="ADMIN" th:selected="${u.role == 'ADMIN'}">مدير</option><option value="LIBRARIAN" th:selected="${u.role == 'LIBRARIAN'}">أمين مكتبة</option></select><button class="btn btn-light btn-sm">حفظ الاسم والدور</button></form><form method="post" th:action="@{/users/{id}/toggle(id=${u.id})}"><button class="btn btn-light btn-sm">تفعيل / تعطيل</button></form><form class="inline-form" method="post" th:action="@{/users/{id}/password(id=${u.id})}"><input class="form-control" name="password" type="password" minlength="12" required autocomplete="new-password" aria-label="كلمة مرور جديدة" placeholder="كلمة مرور جديدة"><button class="btn btn-light btn-sm">تغيير كلمة المرور</button></form></td></tr></tbody></table></div></section><h2>إضافة مستخدم</h2><form class="panel editor" method="post" th:action="@{/users}" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><div class="form-grid"><div class="field"><label for="username">اسم المستخدم</label><input class="form-control" id="username" type="text" th:field="*{username}" required dir="ltr"></div><div class="field"><label for="fullName">الاسم الكامل</label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" required></div><div class="field"><label for="password">كلمة المرور (١٢ حرفًا على الأقل)</label><input class="form-control" id="password" type="password" th:field="*{password}" required minlength="12" autocomplete="new-password"></div><div class="field"><label for="role">الدور</label><select class="form-select" th:field="*{role}"><option value="LIBRARIAN">أمين مكتبة</option><option value="ADMIN">مدير</option></select></div></div><div class="form-actions"><button class="btn btn-primary">حفظ البيانات</button><button type="button" class="btn btn-light" data-back>رجوع</button></div></form></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
