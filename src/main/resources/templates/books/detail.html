<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('تفاصيل الكتاب')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>تفاصيل الكتاب</h1><p>بيانات الكتاب وسجل الإعارات.</p></div><a class="btn btn-primary" th:href="@{/books/{id}/edit(id=${book.id})}">تعديل الكتاب</a></div><section class="panel detail-card"><div class="detail-symbol">▤</div><div><span class="eyebrow" th:text="${book.category}"></span><h2 th:text="${book.title}"></h2><p th:text="${book.author}"></p><p class="pre-wrap" th:text="${book.description}"></p><dl class="detail-grid"><dt>النسخ المتاحة / الإجمالي</dt><dd th:text="${available} + ' / ' + ${book.totalCopies}"></dd><dt>ISBN</dt><dd th:text="${book.isbn}"></dd><dt>الناشر / سنة النشر</dt><dd th:text="${book.publisher} + ' / ' + ${book.publicationYear}"></dd><dt>الرف</dt><dd th:text="${book.shelfLocation}"></dd></dl><form th:if="${book.active}" method="post" th:action="@{/books/{id}/archive(id=${book.id})}" data-confirm="هل تريد أرشفة الكتاب؟ سيُحفظ سجل إعاراته."><button class="btn btn-outline-danger">أرشفة الكتاب</button></form><p th:unless="${book.active}" class="badge neutral">هذا الكتاب مؤرشف</p></div></section><section class="panel"><h2>سجل إعارات الكتاب</h2><th:block th:with="rows=${rows.content}"><div th:replace="~{fragments/layout :: loanTable}"></div></th:block><a th:href="@{/loans}">عرض سجل الإعارات الكامل ←</a></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
