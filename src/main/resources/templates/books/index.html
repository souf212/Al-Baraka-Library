<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('الكتب')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>رفوف المعرفة</h1><p>أدر مجموعة المكتبة، وابحث عن قراءتك القادمة.</p></div><a class="btn btn-primary" th:href="@{/books/new}">＋ إضافة كتاب</a></div><section class="panel"><form class="filters" th:action="@{/books}"><input class="form-control" name="q" th:value="${q}" placeholder="عنوان، مؤلف أو ISBN" aria-label="البحث"><select class="form-select" name="category" aria-label="التصنيف"><option value="">كل التصنيفات</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option></select><label class="check"><input type="checkbox" name="available" value="true" th:checked="${onlyAvailable}"> المتاحة فقط</label><label class="check"><input type="checkbox" name="archived" value="true" th:checked="${archived}"> تشمل الأرشيف</label><button class="btn btn-primary">بحث</button></form><div class="table-responsive"><table class="table"><thead><tr><th>الكتاب / المؤلف</th><th>التصنيف</th><th>النسخ</th><th>المتاحة</th><th>المستعارة</th><th>الرف</th><th></th></tr></thead><tbody><tr th:each="b : ${rows.content}"><td><a class="book-title" th:href="@{/books/{id}(id=${b.id})}" th:text="${b.title}"></a><small th:text="${b.author}"></small><span th:if="${!b.active}" class="badge neutral">مؤرشف</span></td><td th:text="${b.category}"></td><td th:text="${b.totalCopies}"></td><td><span class="badge green" th:text="${availability[b.id]}"></span></td><td th:text="${b.totalCopies - availability[b.id]}"></td><td th:text="${b.shelfLocation}"></td><td><a th:href="@{/books/{id}/edit(id=${b.id})}">تعديل ←</a></td></tr><tr th:if="${rows.empty}"><td class="empty" colspan="7">الرفوف تنتظر أول كتاب. أضف كتابًا للبدء.</td></tr></tbody></table></div><div class="pagination-bar"><a th:if="${rows.hasPrevious()}" th:href="@{/books(page=${rows.number-1},q=${q},category=${category},available=${onlyAvailable},archived=${archived})}">→ السابق</a><span th:text="'صفحة ' + ${rows.number+1}"></span><a th:if="${rows.hasNext()}" th:href="@{/books(page=${rows.number+1},q=${q},category=${category},available=${onlyAvailable},archived=${archived})}">التالي ←</a></div></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
