<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('بيانات الكتاب')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>بيانات الكتاب</h1><p>كل التفاصيل التي تجعل الوصول إلى الكتاب أسهل.</p></div></div><form class="panel editor" method="post" th:action="${id == null} ? @{/books/new} : @{/books/{id}/edit(id=${id})}" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><div class="form-grid"><div class="field"><label for="title">عنوان الكتاب *</label><input class="form-control" id="title" type="text" th:field="*{title}" required maxlength="240"></div><div class="field"><label for="author">المؤلف *</label><input class="form-control" id="author" type="text" th:field="*{author}" required></div><div class="field"><label for="category">التصنيف *</label><input class="form-control" id="category" type="text" th:field="*{category}" required></div><div class="field"><label for="isbn">الرقم الدولي ISBN</label><input class="form-control" id="isbn" type="text" th:field="*{isbn}" dir="ltr"></div><div class="field"><label for="totalCopies">عدد النسخ *</label><input class="form-control" id="totalCopies" type="number" th:field="*{totalCopies}" min="0" required></div><div class="field"><label for="publisher">دار النشر</label><input class="form-control" id="publisher" type="text" th:field="*{publisher}" ></div><div class="field"><label for="publicationYear">سنة النشر</label><input class="form-control" id="publicationYear" type="number" th:field="*{publicationYear}" ></div><div class="field"><label for="shelfLocation">موقع الرف</label><input class="form-control" id="shelfLocation" type="t
