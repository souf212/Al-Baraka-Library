<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' · مكتبة البركة'"></title><link rel="stylesheet" th:href="@{/vendor/bootstrap.rtl.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<aside class="sidebar" id="navigation" th:fragment="sidebar"><a class="brand" th:href="@{/}"><img th:if="${library.logoPath != null}" class="brand-logo" th:src="@{/logo}" alt="شعار الجمعية"><span th:unless="${library.logoPath != null}" class="brand-icon">▤</span><span><b th:text="${library.libraryName}">مكتبة البركة</b><small>AL BARAKA LIBRARY</small></span></a><div class="sidebar-label">إدارة المكتبة</div><nav aria-label="القائمة الرئيسية"><a th:href="@{/}"><span>◈</span> لوحة التحكم</a><a th:href="@{/books}"><span>▤</span> الكتب</a><a th:href="@{/borrowers}"><span>♙</span> المستعيرون</a><a th:href="@{/loans}"><span>⇄</span> الإعارات</a><a th:href="@{/returns(status='ACTIVE')}"><span>↶</span> الإرجاع والتجديد</a><a th:href="@{/reminders}"><span>◷</span> التذكيرات</a><a th:href="@{/reports}"><span>▥</span> التقارير</a><a th:if="${currentUser != null and currentUser.role == 'ADMIN'}" th:href="@{/settings}"><span>⚙</span> الإعدادات</a></nav><div class="sidebar-bottom"><div class="offline-dot">● <span>بياناتك محفوظة على هذا الجهاز</span></div><form th:action="@{/logout}" method="post"><button class="logout" type="submit">↪ تسجيل الخروج</button></form></div></aside>
<header class="topbar" th:fragment="topbar"><button type="button" id="menu-toggle" aria-controls="navigation" aria-expanded="false" class="menu-toggle" aria-label="فتح القائمة">☰</button><form th:action="@{/books}" class="global-search"><span>⌕</span><input name="q" aria-label="البحث في الكتب" placeholder="ابحث عن كتاب، مؤلف أو رقم دولي..."></form><div class="topbar-user"><span class="avatar">م</span><span><b th:text="${currentUser != null ? currentUser.fullName : 'المكتبة'}"></b><small th:text="${currentUser != null and currentUser.role == 'ADMIN' ? 'مدير المكتبة' : 'أمين المكتبة'}"></small></span></div></header>
<div th:fragment="errors" th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<div th:fragment="loanTable" class="table-responsive"><table class="table"><thead><tr><th>الكتاب</th><th>المستعير</th><th>موعد الإرجاع</th><th>الحالة</th><th></th></tr></thead><tbody><tr th:each="l : ${rows}"><td><a th:href="@{/books/{id}(id=${l.book.id})}" th:text="${l.book.title}"></a></td><td><a th:href="@{/borrowers/{id}(id=${l.borrower.id})}" th:text="${l.borrower.fullName}"></a></td><td class="date" th:text="${l.dueDate}"></td><td><span class="badge" th:classappend="${l.status == 'RETURNED' ? 'neutral' : (l.dueDate.isBefore(today) ? 'danger' : 'green')}" th:text="${l.status == 'RETURNED' ? 'مُرجع' : (l.dueDate.isBefore(today) ? 'متأخرة' : 'نشطة')}"></span></td><td><a class="text-link" th:href="@{/loans/{id}(id=${l.id})}">التفاصيل ←</a></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="empty">لا توجد إعارات لعرضها</td></tr></tbody></table></div>
</body></html>
