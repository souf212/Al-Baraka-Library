<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('بيانات المستعير')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>بيانات المستعير</h1><p>تعرف إلى قارئ جديد، واحفظ وسيلة التواصل المناسبة.</p></div></div><form class="panel editor" method="post" th:action="${id == null} ? @{/borrowers/new} : @{/borrowers/{id}/edit(id=${id})}" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><div class="form-grid"><div class="field"><label for="fullName">الاسم الكامل *</label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" required></div><div class="field"><label for="phoneNumber">رقم الهاتف *</label><input class="form-control" id="phoneNumber" type="tel" th:field="*{phoneNumber}" required dir="ltr" placeholder="0612345678"></div><div class="field"><label for="whatsappNumber">رقم واتساب</label><input class="form-control" id="whatsappNumber" type="tel" th:field="*{whatsappNumber}" dir="ltr"></div><div class="field"><label for="email">البريد الإلكتروني</label><input class="form-control" id="email" type="email" th:field="*{email}" dir="ltr"></div><div class="field"><label for="membershipDate">تاريخ التسجيل</label><input class="form-control" id="membershipDate" type="date" th:field="*{membershipDate}" required></div><div class="field"><label for="status">الحالة</label><select class="form-select" th:field="*{status}"><option value="ACTIVE">نشط</option><option value="DISABLED">موقوف</option></select></div><div class="field wide"><label for="address">العنوان</label><textarea class="form-control" id="address" th:field="*{address}" rows="4"></textarea></div><div class="field wide"><label for="notes">ملاحظات</label><textarea class="form-control" id="notes" th:field="*{notes}" rows="4"></textarea></div><label class="check wide"><input type="checkbox" th:field="*{whatsappConsent}"> وافق المستعير على تلقي تذكيرات المكتبة عبر واتساب. يمكن سحب الموافقة في أي وقت.</label></div><div class="form-actions"><button class="btn btn-primary">حفظ البيانات</button><button type="button" class="btn btn-light" data-back>رجوع</button></div></form></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
