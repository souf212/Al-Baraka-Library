<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('ملف المستعير')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>ملف المستعير</h1><p>بيانات التواصل وسجل الاستعارة.</p></div><a class="btn btn-primary" th:href="@{/borrowers/{id}/edit(id=${borrower.id})}">تعديل البيانات والموافقة</a></div><section class="panel"><h2 th:text="${borrower.fullName}"></h2><dl class="detail-grid"><dt>الهاتف</dt><dd dir="ltr" th:text="${borrower.phoneNumber}"></dd><dt>واتساب</dt><dd dir="ltr" th:text="${borrower.whatsappNumber}"></dd><dt>موافقة واتساب</dt><dd th:text="${borrower.whatsappConsent ? 'موافق' : 'غير موافق'}"></dd><dt>الحالة</dt><dd th:text="${borrower.status == 'ACTIVE' ? 'نشط' : 'موقوف'}"></dd><dt>البريد</dt><dd th:text="${borrower.email}"></dd><dt>العنوان</dt><dd th:text="${borrower.address}"></dd><dt>تاريخ التسجيل</dt><dd th:text="${borrower.membershipDate}"></dd><dt>ملاحظات</dt><dd th:text="${borrower.notes}"></dd></dl><form method="post" th:if="${borrower.status == 'ACTIVE'}" th:action="@{/borrowers/{id}/disable(id=${borrower.id})}" data-confirm="هل تريد إيقاف المستعير وإلغاء موافقة واتساب؟"><button class="btn btn-outline-danger">إيقاف الاستعارة وسحب الموافقة</button></form></section><section class="panel"><h2>سجل الاستعارة</h2><th:block th:with="rows=${rows.content}"><div th:replace="~{fragments/layout :: loanTable}"></div></th:block><div class="pagination-bar"><a th:if="${rows.hasPrevious()}" th:href="@{/borrowers/{id}(id=${borrower.id},page=${rows.number-1})}">السابق</a><span th:text="'صفحة ' + ${rows.number+1}"></span><a th:if="${rows.hasNext()}" th:href="@{/borrowers/{id}(id=${borrower.id},page=${rows.number+1})}">التالي</a></div></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
