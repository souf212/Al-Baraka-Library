<!doctype html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('المستعيرون')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content"><div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div class="page-heading"><div><div class="eyebrow">مكتبة البركة / إدارة المكتبة</div><h1>مجتمع القرّاء</h1><p>بيانات المستعيرين، وتاريخهم مع المكتبة.</p></div><a class="btn btn-primary" th:href="@{/borrowers/new}">＋ تسجيل مستعير</a></div><section class="panel"><form class="filters" th:action="@{/borrowers}"><input class="form-control" name="q" th:value="${q}" placeholder="ابحث بالاسم أو رقم الهاتف" aria-label="البحث"><button class="btn btn-primary">بحث</button></form><div class="table-responsive"><table class="table"><thead><tr><th>المستعير</th><th>الهاتف</th><th>تاريخ التسجيل</th><th>الحالة</th><th>موافقة واتساب</th></tr></thead><tbody><tr th:each="b : ${rows.content}"><td><a th:href="@{/borrowers/{id}(id=${b.id})}" th:text="${b.fullName}"></a></td><td dir="ltr" th:text="${b.phoneNumber}"></td><td th:text="${b.membershipDate}"></td><td th:text="${b.status == 'ACTIVE' ? 'نشط' : 'موقوف'}"></td><td th:text="${b.whatsappConsent ? 'موافق' : 'غير موافق'}"></td></tr><tr th:if="${rows.empty}"><td colspan="5" class="empty">لا يوجد مستعيرون بعد. سجّل أول قارئ.</td></tr></tbody></table></div><div class="pagination-bar"><a th:if="${rows.hasPrevious()}" th:href="@{/borrowers(q=${q},page=${rows.number-1})}">السابق</a><span th:text="'صفحة ' + ${rows.number+1}"></span><a th:if="${rows.hasNext()}" th:href="@{/borrowers(q=${q},page=${rows.number+1})}">التالي</a></div></section></div></main><script th:src="@{/js/app.js}" defer></script></body></html>
